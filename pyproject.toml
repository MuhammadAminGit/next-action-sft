[project]
name = "next-action-sft"
version = "0.1.0"
description = "Fine-tuning a small open model to predict a policy-bound agent's next action, with an evaluation that shows whether it helped."
requires-python = ">=3.11"
dependencies = ["mlx-lm>=0.31", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nextaction"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
